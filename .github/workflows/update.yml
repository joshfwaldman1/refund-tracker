name: Refresh ledger

on:
  schedule:
    - cron: "20 13 * * *"   # daily, 9:20am ET (EIA gas prices post Monday afternoons; PMMS Thursdays)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull raw series (best effort; failures keep cached values)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python fetch_data.py
      - name: Build ledger
        run: python build.py
      - name: Commit if changed
        run: |
          git config user.name "ledger-bot"
          git config user.email "ledger-bot@users.noreply.github.com"
          git add data/cache.json docs/data.js docs/data.json
          git diff --cached --quiet && echo "no change" || git commit -m "Refresh ledger data $(date -u +%Y-%m-%d)"
          git push
